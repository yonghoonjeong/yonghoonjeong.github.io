{% assign skills = site.data.data.skills %}
{% if skills %}
<div class="skills-container container-block">
  <h2 class="container-block-title">{{ skills.title }}</h2>
  <ul class="list-unstyled interests-list">
    {% for skill in skills.info %}
    <li style="margin-bottom: 10px;">
      <strong>{{ skill.label }}</strong><br>
      <span class="lang-desc" style="float: none;">{{ skill.details }}</span>
    </li>
    {% endfor %}
  </ul>
</div><!--//skills-->
{% endif %}
