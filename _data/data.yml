career-profile:
  title: About Me
  summary: |
    I am a faculty member in the <a class="context-link" href="#experience-rokna" title="View my ROKNA appointment in Professional Experience">Department of Cyber Science at ROKNA</a> and a naval officer. My research focuses on <span class="research-topic">wireless and mobile system design</span> for reliable, low-power communication. My earlier research included <a class="context-link" href="#paper-rppg" data-highlight-targets="paper-rppg paper-rppg-facial-video" title="View related rPPG publications" aria-label="View related rPPG publications">remote photoplethysmography (rPPG)</a>, autonomous racing with the <a class="context-link" href="#experience-kaist" title="View my KAIST research internship in Professional Experience">Unmanned Systems Research Group (USRG)</a> at <a class="context-link" href="#experience-kaist" title="View my KAIST research internship in Professional Experience">KAIST</a> for the [Indy Autonomous Challenge (IAC)](https://www.indyautonomouschallenge.com/), and AI hardware at <a class="context-link" href="#experience-etri" title="View my ETRI research experience in Professional Experience">ETRI</a>.
    
    My master’s research in the <a class="context-link" href="#experience-snu" title="View my NETLAB research experience in Professional Experience">Network Laboratory (NETLAB)</a> at <a class="context-link" href="#experience-snu" title="View my SNU research experience in Professional Experience">SNU</a> focused on the <a class="research-paper-link" href="#paper-lora-interference" data-highlight-targets="paper-lora-interference paper-lora-energy-scattering paper-arbitrary-chirp-ser paper-lora-asynchronous-interference" title="View related LoRa and chirp-modulation publications" aria-label="View related LoRa and chirp-modulation publications">theoretical analysis of interference resilience in LoRa</a>. I examined how non-linear chirps redistribute interference energy. I also contributed to <a class="context-link" href="#paper-d2-plc" data-highlight-targets="paper-d2-plc paper-dc-plc-demo paper-dc-plc-applications" title="View related DC-PLC publications" aria-label="View related DC-PLC publications">D²-PLC</a>, a collaborative project on low-power DC power-line communication and hardware prototyping. I continue to study LoRa and am extending my research to <a class="research-paper-link" href="#paper-underwater-backscatter" data-highlight-targets="paper-underwater-backscatter paper-underwater-data-collection paper-underwater-survey" title="View related underwater backscatter publications" aria-label="View related underwater backscatter publications">underwater acoustic backscatter</a> for <span class="research-topic">Ocean IoT</span>.
    

