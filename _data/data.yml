career-profile:
  title: About
  summary: |
    Yonghoon Jeong is a lecturer (Assistant Professor-track) in the Department of Cyber Science and a researcher at the Institute of Naval Research, Republic of Korea Naval Academy, fulfilling his mandatory military service through May 2029. His research interests include wireless communication systems, physical-layer wireless sensing and networking, low-power wide-area networks, underwater acoustic communications, and ocean IoT. He is particularly interested in extending reliable wireless communications beyond conventional terrestrial networks to challenging satellite and underwater communication channels.

